[package]
name = "terax"
version = "0.8.2"
description = "Jonathan — an open-source AI-native terminal emulator"
authors = ["crynta"]
license = "Apache-2.0"
edition = "2021"

# Explicit binary name so the dev executable (and its Windows taskbar /
# right-click label) reads "Jonathan" instead of the crate name "terax".
[[bin]]
name = "Jonathan"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "terax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "6"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
nucleo-matcher = "0.3"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", default-features = false, features = [
	"rt",
	"net",
	"io-util",
	# `time` backs the dev-only TERAX_PREVIEW_OPEN_DELAY_MS knob in preview.rs.
	# Async sleep specifically, so widening the webview-create window does not
	# park a runtime worker thread and perturb the very race being tested.
	"time",
] }
tokio-tungstenite = "0.24"
tempfile = "3"
notify = "8.2.0"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSUserDefaults"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_Diagnostics_ToolHelp",
] }
winrt-toast = "0.1"
# Idiomatic `windows` crate (not windows-sys) for preview_capture.rs: the
# webview's ParentWindow() COM call returns a `windows::Win32::Foundation::HWND`
# (see webview2-com-sys), and webview2-com is already pinned to windows 0.61 by
# wry — using the same crate keeps that HWND a single, unified type instead of
# two incompatible bindgen'd structs.
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Threading",
	"Win32_UI_WindowsAndMessaging",
] }
webview2-com = "0.38"
base64 = "0.23"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[patch.crates-io]
# Vendored tao 0.35.3 with one fix: KEY_EVENT_BUILDERS.lock() -> try_lock()
# in src/platform_impl/windows/event_loop.rs. That mutex isn't reentrant,
# and process_message()'s internal PeekMessageW lookahead can let Windows
# dispatch a pending sent message for another owned window synchronously,
# re-entering the same closure on the same thread while the lock is still
# held -> permanent UI-thread self-deadlock (root cause of the app hangs).
# Remove this patch once upstream tao fixes the reentrancy.
tao = { path = "vendor/tao" }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
